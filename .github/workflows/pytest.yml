name: pytest

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest flask flask_sqlalchemy pymupdf

      - name: Run tests
        env:
          PYTHONPATH: interactive_scoreboard:mcq_flashcards:pdf_grid_flashcards:sliding_rows_flashcards:trivia_flashcards:what_the_spell:where_in_the_world:whovian_degrees:price_time_machine:.
        run: python -m pytest -v
