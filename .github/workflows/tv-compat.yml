name: TV compatibility

# Pages that run on TVs (What The Spell's board, and the Trivia, MCQ and Sliding Rows boards
# while they follow a phone remote) are checked against the older smart-TV browsers listed in
# tools/frontend/tv-browsers.txt. Runs only when those files or their sources change.
on:
  push:
    branches: [main]
    paths:
      - 'what_the_spell/static/**'
      - 'trivia_flashcards/static/**'
      - 'mcq_flashcards/static/**'
      - 'sliding_rows_flashcards/static/**'
      - 'tv_link/static/**'
      - 'shared/remote/**'
      - 'shared/quiz_night/**'
      - 'shared/portal_nav/**'
      - 'tools/frontend/**'
      - '.github/workflows/tv-compat.yml'
  pull_request:
    branches: [main]
    paths:
      - 'what_the_spell/static/**'
      - 'trivia_flashcards/static/**'
      - 'mcq_flashcards/static/**'
      - 'sliding_rows_flashcards/static/**'
      - 'tv_link/static/**'
      - 'shared/remote/**'
      - 'shared/quiz_night/**'
      - 'shared/portal_nav/**'
      - 'tools/frontend/**'
      - '.github/workflows/tv-compat.yml'

permissions:
  contents: read

concurrency:
  group: tv-compat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-tv:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/frontend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/frontend/package-lock.json

      - name: Install tools
        run: npm ci

      - name: Check TV pages against older smart-TV browsers
        run: npm run check:tv
