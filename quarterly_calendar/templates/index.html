<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quarterly Calendar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
            gap: 1px;
            background-color: #e5e7eb; /* tailwind gray-200 */
            border: 1px solid #e5e7eb;
        }
        .day-cell {
            background-color: white;
            min-height: 80px;
            padding: 4px;
            position: relative;
        }
        .day-cell.inactive {
            background-color: #f9fafb; /* tailwind gray-50 */
            color: #9ca3af; /* tailwind gray-400 */
        }
        .day-number {
            font-size: 0.75rem;
            font-weight: bold;
            color: #4b5563; /* tailwind gray-600 */
            margin-bottom: 2px;
        }
        .event-bar {
            font-size: 0.65rem;
            padding: 2px 4px;
            margin-bottom: 2px;
            border-radius: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            cursor: pointer;
            position: relative;
            z-index: 10;
        }
        .event-sporting {
            background-color: #bfdbfe; /* blue-200 */
            color: #1e3a8a; /* blue-900 */
            border-left: 2px solid #3b82f6; /* blue-500 */
        }
        .event-cultural {
            background-color: #fef08a; /* yellow-200 */
            color: #713f12; /* yellow-900 */
            border-left: 2px solid #eab308; /* yellow-500 */
        }
        .event-other {
            background-color: #e5e7eb; /* gray-200 */
            color: #1f2937; /* gray-800 */
            border-left: 2px solid #6b7280; /* gray-500 */
        }
        .event-tentative {
            border: 1px dashed currentColor;
            opacity: 0.8;
        }
    </style>
</head>
<body class="bg-gray-100 font-sans">
    <nav style="background-color: #1f2937; color: #ffffff; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; font-family: sans-serif; font-size: 14px; border-bottom: 1px solid #374151;" aria-label="Portal Navigation">
        <div style="display: flex; align-items: center; gap: 10px;">
            <span style="font-weight: 700; color: #f3f4f6;">Quarterly Calendar Portal</span>
            <span style="background-color: #374151; color: #9ca3af; padding: 2px 8px; border-radius: 9999px; font-size: 12px;">Standalone Service</span>
        </div>
        <a id="portal-back-link" href="https://trivial-things.onrender.com" aria-label="Back to Central Portal" class="focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white focus-visible:ring-offset-2 focus-visible:ring-offset-gray-900" style="background-color: #2563eb; color: #ffffff; text-decoration: none; padding: 6px 14px; border-radius: 6px; font-weight: 600; transition: background-color 0.2s;" onmouseover="this.style.backgroundColor='#1d4ed8'" onmouseout="this.style.backgroundColor='#2563eb'"><span aria-hidden="true">← </span>Back to Central Portal</a>
    </nav>

    <div class="max-w-7xl mx-auto p-8">
        <h1 class="text-3xl font-bold mb-8 text-center text-gray-800">Annual Quarterly Calendar</h1>

        <!-- Controls / Add Event Form -->
        <div class="bg-white p-6 rounded-lg shadow-md mb-8">
            <h2 class="text-xl font-semibold mb-4 text-gray-700">Add Event</h2>
            <form id="add-event-form" class="grid grid-cols-1 md:grid-cols-6 gap-4 items-end">
                <div class="col-span-1 md:col-span-2">
                    <label for="title" class="block text-sm font-medium text-gray-700">Event Name</label>
                    <input type="text" id="title" name="title" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-300 focus:ring focus:ring-indigo-200 focus:ring-opacity-50 p-2 border">
                </div>
                <div>
                    <label for="start_date" class="block text-sm font-medium text-gray-700">Start Date</label>
                    <input type="date" id="start_date" name="start_date" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-300 focus:ring focus:ring-indigo-200 focus:ring-opacity-50 p-2 border">
                </div>
                <div>
                    <label for="end_date" class="block text-sm font-medium text-gray-700">End Date</label>
                    <input type="date" id="end_date" name="end_date" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-300 focus:ring focus:ring-indigo-200 focus:ring-opacity-50 p-2 border">
                </div>
                <div>
                    <label for="category" class="block text-sm font-medium text-gray-700">Category</label>
                    <select id="category" name="category" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-300 focus:ring focus:ring-indigo-200 focus:ring-opacity-50 p-2 border">
                        <option value="Sporting">Sporting</option>
                        <option value="Cultural">Cultural</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="flex items-center space-x-2">
                    <input type="checkbox" id="is_tentative" name="is_tentative" class="rounded border-gray-300 text-indigo-600 shadow-sm focus:border-indigo-300 focus:ring focus:ring-indigo-200 focus:ring-opacity-50 h-5 w-5">
                    <label for="is_tentative" class="text-sm font-medium text-gray-700">Tentative (Prone to alter)</label>
                </div>
                <div>
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50">
                        Add
                    </button>
                </div>
            </form>
        </div>

        <!-- Year / Quarters Container -->
        <div class="space-y-12" id="year-container">
            <!-- Quarters will be injected here by JS -->
        </div>
    </div>

    <!-- Delete Modal -->
    <div id="delete-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50" role="dialog" aria-modal="true" aria-labelledby="modal-event-title">
        <div class="bg-white p-6 rounded-lg shadow-lg max-w-sm w-full">
            <h3 class="text-lg font-bold mb-4" id="modal-event-title">Event</h3>
            <p class="text-sm text-gray-600 mb-6">Are you sure you want to delete this event?</p>
            <div class="flex justify-end space-x-4">
                <button id="cancel-delete" class="px-4 py-2 bg-gray-200 text-gray-800 rounded hover:bg-gray-300 focus:outline-none focus:ring-2 focus:ring-gray-400">Cancel</button>
                <button id="confirm-delete" class="px-4 py-2 bg-red-600 text-white rounded hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-red-500">Delete</button>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
