<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quarterly Calendar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
            gap: 1px;
            background-color: #e5e7eb; /* tailwind gray-200 */
            border: 1px solid #e5e7eb;
        }
        .day-cell {
            background-color: white;
            min-height: 80px;
            padding: 4px;
            position: relative;
        }
        .day-cell.inactive {
            background-color: #f9fafb; /* tailwind gray-50 */
            color: #9ca3af; /* tailwind gray-400 */
        }
        .day-number {
            font-size: 0.75rem;
            font-weight: bold;
            color: #4b5563; /* tailwind gray-600 */
            margin-bottom: 2px;
        }
        .event-bar {
            font-size: 0.65rem;
            padding: 2px 4px;
            margin-bottom: 2px;
            border-radius: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            cursor: pointer;
            position: relative;
            z-index: 10;
        }
        .event-sporting {
            background-color: #bfdbfe; /* blue-200 */
            color: #1e3a8a; /* blue-900 */
            border-left: 2px solid #3b82f6; /* blue-500 */
        }
        .event-cultural {
            background-color: #fef08a; /* yellow-200 */
            color: #713f12; /* yellow-900 */
            border-left: 2px solid #eab308; /* yellow-500 */
        }
        .event-other {
            background-color: #e5e7eb; /* gray-200 */
            color: #1f2937; /* gray-800 */
            border-left: 2px solid #6b7280; /* gray-500 */
        }
        .event-tentative {
            border: 1px dashed currentColor;
            opacity: 0.8;
        }
    </style>
</head>
<body class="bg-gray-100 p-8 font-sans">
    <div class="max-w-7xl mx-auto">
        <h1 class="text-3xl font-bold mb-8 text-center text-gray-800">Annual Quarterly Calendar</h1>

        <!-- Controls / Add Event Form -->
        <div class="bg-white p-6 rounded-lg shadow-md mb-8">
            <h2 class="text-xl font-semibold mb-4 text-gray-700">Add Event</h2>
            <form id="add-event-form" class="grid grid-cols-1 md:grid-cols-6 gap-4 items-end">
                <div class="col-span-1 md:col-span-2">
                    <label for="title" class="block text-sm font-medium text-gray-700">Event Name</label>
                    <input type="text" id="title" name="title" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-300 focus:ring focus:ring-indigo-200 focus:ring-opacity-50 p-2 border">
                </div>
                <div>
                    <label for="start_date" class="block text-sm font-medium text-gray-700">Start Date</label>
                    <input type="date" id="start_date" name="start_date" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-300 focus:ring focus:ring-indigo-200 focus:ring-opacity-50 p-2 border">
                </div>
                <div>
                    <label for="end_date" class="block text-sm font-medium text-gray-700">End Date</label>
                    <input type="date" id="end_date" name="end_date" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-300 focus:ring focus:ring-indigo-200 focus:ring-opacity-50 p-2 border">
                </div>
                <div>
                    <label for="category" class="block text-sm font-medium text-gray-700">Category</label>
                    <select id="category" name="category" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-300 focus:ring focus:ring-indigo-200 focus:ring-opacity-50 p-2 border">
                        <option value="Sporting">Sporting</option>
                        <option value="Cultural">Cultural</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="flex items-center space-x-2">
                    <input type="checkbox" id="is_tentative" name="is_tentative" class="rounded border-gray-300 text-indigo-600 shadow-sm focus:border-indigo-300 focus:ring focus:ring-indigo-200 focus:ring-opacity-50 h-5 w-5">
                    <label for="is_tentative" class="text-sm font-medium text-gray-700">Tentative (Prone to alter)</label>
                </div>
                <div>
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50">
                        Add
                    </button>
                </div>
            </form>
        </div>

        <!-- Year / Quarters Container -->
        <div class="space-y-12" id="year-container">
            <!-- Quarters will be injected here by JS -->
        </div>
    </div>

    <!-- Delete Modal -->
    <div id="delete-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50">
        <div class="bg-white p-6 rounded-lg shadow-lg max-w-sm w-full">
            <h3 class="text-lg font-bold mb-4" id="modal-event-title">Event</h3>
            <p class="text-sm text-gray-600 mb-6">Are you sure you want to delete this event?</p>
            <div class="flex justify-end space-x-4">
                <button id="cancel-delete" class="px-4 py-2 bg-gray-200 text-gray-800 rounded hover:bg-gray-300">Cancel</button>
                <button id="confirm-delete" class="px-4 py-2 bg-red-600 text-white rounded hover:bg-red-700">Delete</button>
            </div>
        </div>
    </div>

    <script>
        let events = [];
        let eventToDelete = null;

        const yearContainer = document.getElementById('year-container');
        const form = document.getElementById('add-event-form');
        const modal = document.getElementById('delete-modal');
        const confirmDeleteBtn = document.getElementById('confirm-delete');
        const cancelDeleteBtn = document.getElementById('cancel-delete');
        const modalEventTitle = document.getElementById('modal-event-title');

        const currentYear = new Date().getFullYear();

        const monthNames = ["January", "February", "March", "April", "May", "June",
                            "July", "August", "September", "October", "November", "December"];

        // Setup the UI layout for Quarters and Months
        function initializeCalendarUI() {
            yearContainer.innerHTML = '';
            for (let q = 0; q < 4; q++) {
                const quarterDiv = document.createElement('div');
                quarterDiv.className = 'bg-white p-6 rounded-lg shadow-md';

                const qTitle = document.createElement('h2');
                qTitle.className = 'text-2xl font-bold mb-4 text-gray-800 border-b pb-2';
                qTitle.textContent = `Q${q + 1} ${currentYear}`;
                quarterDiv.appendChild(qTitle);

                const monthsGrid = document.createElement('div');
                monthsGrid.className = 'grid grid-cols-1 lg:grid-cols-3 gap-6';

                for (let m = 0; m < 3; m++) {
                    const monthIndex = (q * 3) + m;
                    const monthWrapper = createMonthGrid(currentYear, monthIndex);
                    monthsGrid.appendChild(monthWrapper);
                }

                quarterDiv.appendChild(monthsGrid);
                yearContainer.appendChild(quarterDiv);
            }
        }

        function createMonthGrid(year, monthIndex) {
            const wrapper = document.createElement('div');

            const title = document.createElement('h3');
            title.className = 'text-lg font-semibold mb-2 text-center text-gray-700';
            title.textContent = monthNames[monthIndex];
            wrapper.appendChild(title);

            // Days of week header
            const dowHeader = document.createElement('div');
            dowHeader.className = 'grid grid-cols-7 gap-1 text-center text-xs font-medium text-gray-500 mb-1';
            ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].forEach(day => {
                const d = document.createElement('div');
                d.textContent = day;
                dowHeader.appendChild(d);
            });
            wrapper.appendChild(dowHeader);

            const grid = document.createElement('div');
            grid.className = 'calendar-grid';
            grid.id = `grid-${year}-${monthIndex}`;

            const firstDay = new Date(year, monthIndex, 1).getDay();
            const daysInMonth = new Date(year, monthIndex + 1, 0).getDate();
            const prevMonthDays = new Date(year, monthIndex, 0).getDate();

            // Previous month inactive days
            for (let i = 0; i < firstDay; i++) {
                const cell = document.createElement('div');
                cell.className = 'day-cell inactive';
                const dayNum = document.createElement('div');
                dayNum.className = 'day-number';
                dayNum.textContent = prevMonthDays - firstDay + i + 1;
                cell.appendChild(dayNum);
                grid.appendChild(cell);
            }

            // Current month days
            for (let i = 1; i <= daysInMonth; i++) {
                const cell = document.createElement('div');
                cell.className = 'day-cell flex flex-col';
                cell.dataset.date = `${year}-${String(monthIndex + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;

                const dayNum = document.createElement('div');
                dayNum.className = 'day-number';
                dayNum.textContent = i;
                cell.appendChild(dayNum);

                const eventsContainer = document.createElement('div');
                eventsContainer.className = 'flex flex-col space-y-1 mt-1 flex-grow overflow-y-auto';
                eventsContainer.id = `events-${cell.dataset.date}`;
                cell.appendChild(eventsContainer);

                grid.appendChild(cell);
            }

            // Next month inactive days to fill grid (42 cells total)
            const totalCells = firstDay + daysInMonth;
            const remainingCells = (Math.ceil(totalCells / 7) * 7) - totalCells;
            for (let i = 1; i <= remainingCells; i++) {
                const cell = document.createElement('div');
                cell.className = 'day-cell inactive';
                const dayNum = document.createElement('div');
                dayNum.className = 'day-number';
                dayNum.textContent = i;
                cell.appendChild(dayNum);
                grid.appendChild(cell);
            }

            wrapper.appendChild(grid);
            return wrapper;
        }

        async function fetchEvents() {
            try {
                const res = await fetch('/api/events');
                events = await res.json();
                renderEvents();
            } catch (err) {
                console.error("Failed to fetch events", err);
            }
        }

        function renderEvents() {
            // Clear all event containers
            document.querySelectorAll('[id^="events-"]').forEach(el => el.innerHTML = '');

            // Simple rendering: just place the event bar in every day it covers
            events.forEach(event => {
                let current = new Date(event.start_date + 'T00:00:00'); // Force local interpretation
                const end = new Date(event.end_date + 'T00:00:00');

                while (current <= end) {
                    const dateStr = `${current.getFullYear()}-${String(current.getMonth() + 1).padStart(2, '0')}-${String(current.getDate()).padStart(2, '0')}`;
                    const container = document.getElementById(`events-${dateStr}`);

                    if (container) {
                        const eventEl = document.createElement('div');
                        eventEl.className = `event-bar event-${event.category.toLowerCase()} ${event.is_tentative ? 'event-tentative' : ''}`;
                        eventEl.textContent = event.title;
                        eventEl.title = `${event.title} (${event.start_date} to ${event.end_date})`;

                        eventEl.onclick = () => showDeleteModal(event);

                        container.appendChild(eventEl);
                    }

                    current.setDate(current.getDate() + 1);
                }
            });
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(form);
            const data = {
                title: formData.get('title'),
                start_date: formData.get('start_date'),
                end_date: formData.get('end_date'),
                category: formData.get('category'),
                is_tentative: formData.get('is_tentative') === 'on'
            };

            try {
                const res = await fetch('/api/events', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (res.ok) {
                    form.reset();
                    fetchEvents();
                } else {
                    const err = await res.json();
                    alert(err.error || 'Failed to add event');
                }
            } catch (err) {
                console.error(err);
                alert('Error adding event');
            }
        });

        function showDeleteModal(event) {
            eventToDelete = event;
            modalEventTitle.textContent = `Delete: ${event.title}`;
            modal.classList.remove('hidden');
        }

        function hideDeleteModal() {
            eventToDelete = null;
            modal.classList.add('hidden');
        }

        cancelDeleteBtn.addEventListener('click', hideDeleteModal);

        confirmDeleteBtn.addEventListener('click', async () => {
            if (!eventToDelete) return;

            try {
                const res = await fetch(`/api/events/${eventToDelete.id}`, {
                    method: 'DELETE'
                });

                if (res.ok) {
                    hideDeleteModal();
                    fetchEvents();
                } else {
                    alert('Failed to delete event');
                }
            } catch (err) {
                console.error(err);
                alert('Error deleting event');
            }
        });

        // Init
        initializeCalendarUI();
        fetchEvents();

    </script>
</body>
</html>
