<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trivia Flashcards</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <header>
        <h1>MCQ Flashcards</h1>
        <div class="stats" id="stats-container" aria-live="polite">
            Loading stats...
        </div>
    </header>

    <main>
        <section class="flashcard-container" id="flashcard-container" aria-label="Flashcard Area">
            <div class="flashcard" id="flashcard" tabindex="0" role="button" aria-label="Flashcard" aria-expanded="false">
                <div class="flashcard-face flashcard-front" id="front-face" style="flex-direction: column;">
                    <div id="question-text" style="margin-bottom: 20px;" aria-live="polite">Loading...</div>
                    <div id="mcq-choices" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%;" role="group" aria-label="Multiple Choice Options">
                        <!-- Choices will be injected here -->
                    </div>
                </div>
                <div class="flashcard-face flashcard-back" id="answer-text" aria-hidden="true" aria-live="polite">
                    Loading...
                </div>
            </div>
        </section>

        <section class="controls" aria-label="Flashcard Actions">
            <button class="btn-primary" id="next-btn" onclick="loadNextQuestion()">Skip (Keep)</button>
            <button class="btn-danger" id="eliminate-btn" onclick="eliminateAndNext()">Eliminate & Next</button>
        </section>

        <section aria-label="Administrative Actions">
            <button class="btn-warning" id="admin-reset-btn" onclick="resetAll()">Reset All Questions</button>
        </section>

        <section id="empty-state" class="hidden stats" aria-live="polite" style="text-align: center; margin-top: 20px;">
            <h2><span aria-hidden="true">🎉</span> You're all done!</h2>
            <p>You've completed all the flashcards in this deck.</p>
            <button class="btn-primary" id="practice-again-btn" onclick="resetAll()">Practice Again</button>
        </section>

        <div id="error-msg" class="hidden" role="alert" aria-live="assertive"></div>
    </main>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
