<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCQ Flashcards</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/quiz-night.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/portal-nav.css') }}">
</head>
<body class="quiz-night">
    {% include '_portal_nav.html' %}

    <header>
        <h1>MCQ Flashcards</h1>
        <div class="stats" id="stats-container" aria-live="polite">
            Loading stats...
        </div>
    </header>

    <main>
        <section class="flashcard-container" id="flashcard-container" aria-label="Flashcard Area">
            <div class="flashcard" id="flashcard" tabindex="0" role="button" aria-label="Flashcard" aria-expanded="false">
                <div class="flashcard-face flashcard-front" id="front-face">
                    <div id="question-text" aria-live="polite">Loading...</div>
                    <div id="mcq-choices" role="group" aria-label="Multiple Choice Options">
                        <!-- Choices will be injected here -->
                    </div>
                </div>
                <div class="flashcard-face flashcard-back" id="answer-text" aria-hidden="true" aria-live="polite">
                    Loading...
                </div>
            </div>
        </section>

        <section class="controls" aria-label="Flashcard Actions">
            <button class="qn-skip" id="next-btn">Skip (Keep)</button>
            <button class="qn-eliminate" id="eliminate-btn">Eliminate & Next</button>
        </section>

        <section aria-label="Administrative Actions">
            <button class="qn-reset" id="admin-reset-btn">Reset All Questions</button>
        </section>

        <section id="empty-state" class="hidden qn-panel" aria-live="polite">
            <h2><span aria-hidden="true">🎉</span> You're all done!</h2>
            <p>You've completed all the flashcards in this deck.</p>
            <button class="qn-go" id="practice-again-btn">Practice Again</button>
        </section>

        <div id="error-msg" class="hidden" role="alert" aria-live="assertive"></div>
    </main>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
