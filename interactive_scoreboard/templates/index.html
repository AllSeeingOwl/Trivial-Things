<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Scoreboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/quiz-night.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/portal-nav.css') }}">
</head>
<body class="quiz-night">
    {% include '_portal_nav.html' %}

    <div class="container">
        <div class="header-actions">
            <h1>Interactive Scoreboard</h1>
            <a href="/api/export" class="btn qn-skip" aria-label="Export scoreboard rankings to CSV file">Export to CSV</a>
        </div>

        <div class="tabs" role="tablist" aria-label="Scoreboard Sections">
            <button id="tab-rankings" type="button" class="tab-btn active" role="tab" aria-selected="true" aria-controls="rankings" onclick="showTab('rankings')">Rankings</button>
            <button id="tab-statistics" type="button" class="tab-btn" role="tab" aria-selected="false" aria-controls="statistics" onclick="showTab('statistics')">Player Statistics</button>
            <button id="tab-add-score" type="button" class="tab-btn" role="tab" aria-selected="false" aria-controls="add-score" onclick="showTab('add-score')">Add Score</button>
        </div>

        <div id="rankings" class="tab-content active" role="tabpanel" aria-labelledby="tab-rankings">
            <h2>Global Rankings</h2>
            <table id="scores-table">
                <thead>
                    <tr>
                        <th>Rank</th>
                        <th>Player</th>
                        <th>Score</th>
                        <th>Time Taken (s)</th>
                        <th>Date</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Populated by JS -->
                </tbody>
            </table>
        </div>

        <div id="statistics" class="tab-content" role="tabpanel" aria-labelledby="tab-statistics">
            <h2>Player Statistics</h2>
            <table id="stats-table">
                <thead>
                    <tr>
                        <th>Player</th>
                        <th>Games Played</th>
                        <th>Average Score</th>
                        <th>High Score</th>
                        <th>Latest Score</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Populated by JS -->
                </tbody>
            </table>
        </div>

        <div id="add-score" class="tab-content" role="tabpanel" aria-labelledby="tab-add-score">
            <h2>Submit New Score</h2>
            <form id="score-form">
                <div id="form-feedback" class="feedback" role="status" aria-live="polite"></div>
                <div class="form-group">
                    <label for="player_name">Player Name <span class="required" aria-hidden="true">*</span></label>
                    <input type="text" id="player_name" placeholder="e.g. Alex Smith" required>
                </div>
                <div class="form-group">
                    <label for="score">Score <span class="required" aria-hidden="true">*</span></label>
                    <input type="number" id="score" placeholder="e.g. 2500" required>
                </div>
                <div class="form-group">
                    <label for="time_taken">Time Taken (seconds) - Optional</label>
                    <input type="number" step="0.1" id="time_taken" placeholder="e.g. 45.2">
                </div>
                <div class="form-group">
                    <label for="avatar_url">Avatar URL - Optional</label>
                    <input type="url" id="avatar_url" placeholder="https://example.com/avatar.png">
                </div>
                <button type="submit" class="btn qn-go">Submit Score</button>
            </form>
        </div>
    </div>

    <script>
        function showTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => {
                el.classList.remove('active');
                el.setAttribute('aria-selected', 'false');
            });

            document.getElementById(tabId).classList.add('active');
            const targetTab = document.getElementById('tab-' + tabId);
            if (targetTab) {
                targetTab.classList.add('active');
                targetTab.setAttribute('aria-selected', 'true');
            }

            if (tabId === 'rankings') loadScores();
            if (tabId === 'statistics') loadStats();
        }

        function escapeHtml(unsafe) {
            return (unsafe || '').toString()
                 .replace(/&/g, "&amp;")
                 .replace(/</g, "&lt;")
                 .replace(/>/g, "&gt;")
                 .replace(/"/g, "&quot;")
                 .replace(/'/g, "&#039;");
        }

        function getAvatarHtml(url, name) {
            const escapedName = escapeHtml(name);
            if (url) {
                const escapedUrl = escapeHtml(url);
                // Sentinel: Store name in data-name attribute instead of interpolating into onerror string to prevent DOM XSS
                return `<img src="${escapedUrl}" alt="${escapedName}'s avatar" class="avatar" data-name="${escapedName}" onerror="this.outerHTML=getDefaultAvatar(this.getAttribute('data-name'))">`;
            }
            return getDefaultAvatar(escapedName);
        }

        function getDefaultAvatar(name) {
            const initial = name ? escapeHtml(name).charAt(0).toUpperCase() : '?';
            return `<span class="default-avatar">${initial}</span>`;
        }

        async function loadScores() {
            try {
                const response = await fetch('/api/scores');
                const scores = await response.json();

                const tbody = document.querySelector('#scores-table tbody');
                tbody.innerHTML = '';

                // ⚡ Bolt Optimization: DocumentFragment for DOM insertions
                // Using a DocumentFragment batches all tr insertions into memory before attaching
                // to the DOM, eliminating repetitive reflows and repaints during rendering.
                const fragment = document.createDocumentFragment();

                scores.forEach((entry, index) => {
                    const date = entry.timestamp ? escapeHtml(new Date(entry.timestamp).toLocaleString()) : 'N/A';
                    const timeTaken = entry.time_taken !== null ? escapeHtml(entry.time_taken) : 'N/A';
                    const safeName = escapeHtml(entry.player_name);
                    const safeScore = escapeHtml(entry.score);

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${index + 1}</td>
                        <td>
                            ${getAvatarHtml(entry.avatar_url, entry.player_name)}
                            ${safeName}
                        </td>
                        <td><strong>${safeScore}</strong></td>
                        <td>${timeTaken}</td>
                        <td>${date}</td>
                    `;
                    fragment.appendChild(tr);
                });
                tbody.appendChild(fragment);
            } catch (error) {
                console.error('Error loading scores:', error);
            }
        }

        async function loadStats() {
            try {
                const response = await fetch('/api/stats');
                const stats = await response.json();

                // Sort by high score descending
                stats.sort((a, b) => b.high_score - a.high_score);

                const tbody = document.querySelector('#stats-table tbody');
                tbody.innerHTML = '';

                // ⚡ Bolt Optimization: DocumentFragment for DOM insertions
                // Using a DocumentFragment batches all tr insertions into memory before attaching
                // to the DOM, eliminating repetitive reflows and repaints during rendering.
                const fragment = document.createDocumentFragment();

                stats.forEach(player => {
                    const safeName = escapeHtml(player.player_name);
                    const safeGamesPlayed = escapeHtml(player.games_played);
                    const safeAverageScore = escapeHtml(player.average_score);
                    const safeHighScore = escapeHtml(player.high_score);
                    const safeLatestScore = escapeHtml(player.latest_score);

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>
                            ${getAvatarHtml(player.avatar_url, player.player_name)}
                            ${safeName}
                        </td>
                        <td>${safeGamesPlayed}</td>
                        <td>${safeAverageScore}</td>
                        <td><strong>${safeHighScore}</strong></td>
                        <td>${safeLatestScore}</td>
                    `;
                    fragment.appendChild(tr);
                });
                tbody.appendChild(fragment);
            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }

        function showFeedback(message, isSuccess) {
            const feedback = document.getElementById('form-feedback');
            if (!feedback) return;
            feedback.textContent = message;
            feedback.className = 'feedback ' + (isSuccess ? 'is-ok' : 'is-error');
        }

        document.getElementById('score-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const submitBtn = e.target.querySelector('button[type="submit"]');
            const originalText = submitBtn.textContent;

            const data = {
                player_name: document.getElementById('player_name').value,
                score: document.getElementById('score').value,
                time_taken: document.getElementById('time_taken').value || null,
                avatar_url: document.getElementById('avatar_url').value || null
            };

            try {
                submitBtn.disabled = true;
                submitBtn.setAttribute('aria-busy', 'true');
                submitBtn.textContent = 'Submitting...';

                const response = await fetch('/api/scores', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });

                if (response.ok) {
                    showFeedback('Score submitted successfully!', true);
                    document.getElementById('score-form').reset();
                    setTimeout(() => {
                        const feedback = document.getElementById('form-feedback');
                        if (feedback) feedback.className = 'feedback';
                        showTab('rankings');
                    }, 1000);
                } else {
                    const err = await response.json();
                    showFeedback('Error submitting score: ' + (err.error || 'Unknown error'), false);
                }
            } catch (error) {
                console.error('Error:', error);
                showFeedback('Error submitting score. Please check your connection.', false);
            } finally {
                submitBtn.disabled = false;
                submitBtn.removeAttribute('aria-busy');
                submitBtn.textContent = originalText;
            }
        });

        // Load initial data
        loadScores();
    </script>
</body>
</html>
