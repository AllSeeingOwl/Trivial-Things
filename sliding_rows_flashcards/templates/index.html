<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sliding Rows Flashcards</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/quiz-night.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/remote.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/remote-view.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/portal-nav.css') }}">
</head>
<body class="quiz-night">
    {% include '_portal_nav.html' %}

    <div class="container">
        <header>
            <h1>Sliding Rows Flashcards</h1>
            <div class="stats-container">
                <span>Chains Remaining: <span id="chains-remaining">0</span>/<span id="chains-total">0</span></span>
                <button id="reset-button" class="btn qn-reset">Reset All</button>
            </div>
        </header>

        {% include '_remote_connect.html' %}

        <main id="main-content">
            <!-- Filled by remote-tv.js while this board follows a phone remote. -->
            <section id="remote-view" class="remote-view" hidden aria-label="Question chain">
                <p class="rv-stats" id="rv-stats"></p>
                <ol id="rv-rows" class="rv-rows"></ol>
                <p id="rv-note" class="rv-note" aria-live="polite"></p>
            </section>

            <div id="loading" class="hidden" aria-live="polite">Loading chain...</div>
            <div id="error-message" class="hidden error" aria-live="assertive"></div>

            <section id="empty-state" class="hidden stats-container qn-panel" aria-live="polite">
                <h2><span aria-hidden="true">🎉</span> You're all done!</h2>
                <p>You've completed all the question chains.</p>
                <button class="btn primary-btn qn-go" id="practice-again-btn">Practice Again</button>
            </section>

            <div class="chain-container" id="chain-container">
                <!-- Rows will be injected here dynamically via JS -->
            </div>

            <div class="navigation-controls hidden" id="nav-controls">
                <button id="next-chain-button" class="btn primary-btn qn-go">Load Next Chain</button>
            </div>
        </main>
    </div>

    <script src="{{ url_for('static', filename='js/remote-follow.js') }}"></script>
    <script src="{{ url_for('static', filename='js/remote-tv.js') }}"></script>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
