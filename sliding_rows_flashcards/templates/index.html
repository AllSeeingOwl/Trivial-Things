<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sliding Rows Flashcards</title>
    <!-- We'll link to our new stylesheet -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav style="background-color: #1f2937; color: #ffffff; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; font-family: sans-serif; font-size: 14px; border-bottom: 1px solid #374151;" aria-label="Portal Navigation">
        <div style="display: flex; align-items: center; gap: 10px;">
            <span style="font-weight: 700; color: #f3f4f6;">Sliding Rows Flashcards Portal</span>
            <span style="background-color: #374151; color: #9ca3af; padding: 2px 8px; border-radius: 9999px; font-size: 12px;">Standalone Service</span>
        </div>
        <a id="portal-back-link" href="https://trivial-things.onrender.com" style="background-color: #2563eb; color: #ffffff; text-decoration: none; padding: 6px 14px; border-radius: 6px; font-weight: 600; transition: background-color 0.2s;" onmouseover="this.style.backgroundColor='#1d4ed8'" onmouseout="this.style.backgroundColor='#2563eb'">← Back to Central Portal</a>
    </nav>
    <script>
        (function() {
            var link = document.getElementById('portal-back-link');
            if (link) {
                var h = window.location.hostname;
                if (h === 'localhost' || h === '127.0.0.1' || h === '0.0.0.0' || h.startsWith('192.168.') || h.startsWith('10.')) {
                    link.href = 'http://' + h + ':8080';
                }
            }
        })();
    </script>

    <div class="container">
        <header>
            <h1>Sliding Rows Flashcards</h1>
            <div class="stats-container">
                <span>Chains Remaining: <span id="chains-remaining">0</span>/<span id="chains-total">0</span></span>
                <button id="reset-button" class="btn">Reset All</button>
            </div>
        </header>

        <main id="main-content">
            <div id="loading" class="hidden" aria-live="polite">Loading chain...</div>
            <div id="error-message" class="hidden error" aria-live="assertive"></div>

            <section id="empty-state" class="hidden stats-container" aria-live="polite">
                <h2><span aria-hidden="true">🎉</span> You're all done!</h2>
                <p>You've completed all the question chains.</p>
                <button class="btn primary-btn" id="practice-again-btn">Practice Again</button>
            </section>

            <div class="chain-container" id="chain-container">
                <!-- Rows will be injected here dynamically via JS -->
            </div>

            <div class="navigation-controls hidden" id="nav-controls">
                <button id="next-chain-button" class="btn primary-btn">Load Next Chain</button>
            </div>
        </main>
    </div>

    <!-- We'll link to our new script -->
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
