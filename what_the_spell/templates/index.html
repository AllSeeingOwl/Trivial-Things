<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>What The Spell</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav style="background-color: #1f2937; color: #ffffff; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; font-family: sans-serif; font-size: 14px; border-bottom: 1px solid #374151;" aria-label="Portal Navigation">
        <div style="display: flex; align-items: center; gap: 10px;">
            <span style="font-weight: 700; color: #f3f4f6;">What The Spell Portal</span>
            <span style="background-color: #374151; color: #9ca3af; padding: 2px 8px; border-radius: 9999px; font-size: 12px;">Standalone Service</span>
        </div>
        <a id="portal-back-link" href="https://trivial-things.onrender.com" style="background-color: #2563eb; color: #ffffff; text-decoration: none; padding: 6px 14px; border-radius: 6px; font-weight: 600; transition: background-color 0.2s;" onmouseover="this.style.backgroundColor='#1d4ed8'" onmouseout="this.style.backgroundColor='#2563eb'">← Back to Central Portal</a>
    </nav>
    <script>
        (function() {
            var link = document.getElementById('portal-back-link');
            if (link) {
                var h = window.location.hostname;
                if (h === 'localhost' || h === '127.0.0.1' || h === '0.0.0.0' || h.startsWith('192.168.') || h.startsWith('10.')) {
                    link.href = 'http://' + h + ':8080';
                }
            }
        })();
    </script>

    <header>
        <h1>What The Spell</h1>
    </header>

    <main>
        <section class="controls" aria-label="Grid Controls">
            <label for="grid-select">Select Grid:</label>
            <select id="grid-select">
                {% for i in range(num_grids) %}
                <option value="{{ i }}">Grid {{ i + 1 }}</option>
                {% endfor %}
            </select>
            <button id="load-btn">Load Grid</button>
            <button id="reset-btn">Reset Board</button>
        </section>

        <section class="grid-container" id="grid" aria-label="Word Grid">
            <!-- Grid will be generated here -->
        </section>

        <section class="spell-challenge" aria-labelledby="challenge-heading">
            <h2 id="challenge-heading">Spelling Challenge</h2>
            <div class="modes" role="group" aria-label="Spelling Challenge Modes">
                <button class="mode-btn active" data-mode="normal" aria-pressed="true">Normal</button>
                <button class="mode-btn" data-mode="no-vowels" aria-pressed="false">No Vowels</button>
                <button class="mode-btn" data-mode="backwards" aria-pressed="false">Backwards</button>
                <button class="mode-btn" data-mode="both" aria-pressed="false">No Vowels + Backwards</button>
            </div>
            <div>Selected Word:</div>
            <div class="challenge-word" id="current-word" aria-live="polite" aria-atomic="true">---</div>
            <div class="expected-result">
                Expected spelling: <span id="expected-spelling" aria-live="polite" aria-atomic="true">---</span>
            </div>
        </section>
    </main>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
