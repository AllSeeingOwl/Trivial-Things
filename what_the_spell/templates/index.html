<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>What The Spell</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <header>
        <h1>What The Spell</h1>
    </header>

    <main>
        <section class="controls" aria-label="Grid Controls">
            <label for="grid-select">Select Grid:</label>
            <select id="grid-select">
                {% for i in range(num_grids) %}
                <option value="{{ i }}">Grid {{ i + 1 }}</option>
                {% endfor %}
            </select>
            <button id="load-btn">Load Grid</button>
            <button id="reset-btn">Reset Board</button>
        </section>

        <section class="grid-container" id="grid" aria-label="Word Grid">
            <!-- Grid will be generated here -->
        </section>

        <section class="spell-challenge" aria-labelledby="challenge-heading">
            <h2 id="challenge-heading">Spelling Challenge</h2>
            <div class="modes" role="group" aria-label="Spelling Challenge Modes">
                <button class="mode-btn active" data-mode="normal" aria-pressed="true">Normal</button>
                <button class="mode-btn" data-mode="no-vowels" aria-pressed="false">No Vowels</button>
                <button class="mode-btn" data-mode="backwards" aria-pressed="false">Backwards</button>
                <button class="mode-btn" data-mode="both" aria-pressed="false">No Vowels + Backwards</button>
            </div>
            <div>Selected Word:</div>
            <div class="challenge-word" id="current-word" aria-live="polite" aria-atomic="true">---</div>
            <div class="expected-result">
                Expected spelling: <span id="expected-spelling" aria-live="polite" aria-atomic="true">---</span>
            </div>
        </section>
    </main>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
