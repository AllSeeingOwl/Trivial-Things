<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Grid Flashcards</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav style="background-color: #1f2937; color: #ffffff; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; font-family: sans-serif; font-size: 14px; border-bottom: 1px solid #374151;" aria-label="Portal Navigation">
        <div style="display: flex; align-items: center; gap: 10px;">
            <span style="font-weight: 700; color: #f3f4f6;">PDF Grid Flashcards Portal</span>
            <span style="background-color: #374151; color: #9ca3af; padding: 2px 8px; border-radius: 9999px; font-size: 12px;">Standalone Service</span>
        </div>
        <a id="portal-back-link" href="https://trivial-things.onrender.com" style="background-color: #2563eb; color: #ffffff; text-decoration: none; padding: 6px 14px; border-radius: 6px; font-weight: 600; transition: background-color 0.2s;" onmouseover="this.style.backgroundColor='#1d4ed8'" onmouseout="this.style.backgroundColor='#2563eb'">← Back to Central Portal</a>
    </nav>
    <script>
        (function() {
            var link = document.getElementById('portal-back-link');
            if (link) {
                var h = window.location.hostname;
                if (h === 'localhost' || h === '127.0.0.1' || h === '0.0.0.0' || h.startsWith('192.168.') || h.startsWith('10.')) {
                    link.href = 'http://' + h + ':8080';
                }
            }
        })();
    </script>

    <header>
        <h1>PDF Grid Flashcards</h1>
        <p>Upload a PDF containing a colored grid to extract it as interactive flashcards.</p>
    </header>

    <main>
        <section class="controls" aria-label="Upload Controls">
            <form id="upload-form">
                <label for="pdf-file" class="sr-only">Select PDF File</label>
                <input type="file" id="pdf-file" accept="application/pdf" required aria-label="Select PDF File">
                <button type="submit">Upload PDF</button>
            </form>
            <button id="reset-btn" style="display:none; margin-top: 10px;">Reset Grid Colors</button>
        </section>

        <div id="loading" aria-live="polite" aria-busy="false">Processing PDF... Please wait.</div>

        <section class="grid-container" id="grid" aria-label="Interactive Grid" aria-live="polite">
            <!-- Grid will be generated here -->
        </section>
    </main>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
