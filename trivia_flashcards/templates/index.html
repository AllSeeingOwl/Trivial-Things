<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trivia Flashcards</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <header>
        <h1>Trivia Flashcards</h1>
        <div class="stats" id="stats-container" aria-live="polite">
            Loading stats...
        </div>
    </header>

    <main>
        <section class="flashcard-container" id="flashcard-container" aria-label="Flashcard Area">
            <div class="flashcard" id="flashcard" tabindex="0" role="button" aria-label="Flashcard" aria-expanded="false">
                <div class="flashcard-face flashcard-front" id="question-text" aria-live="polite">
                    Loading...
                </div>
                <div class="flashcard-face flashcard-back" id="answer-text" aria-hidden="true" aria-live="polite">
                    Loading...
                </div>
            </div>
        </section>

        <section class="controls" aria-label="Flashcard Actions">
            <button class="btn-secondary hidden" id="flip-btn" onclick="flipCard()">Flip Card</button>
            <button class="btn-primary" id="next-btn" onclick="loadNextQuestion()">Skip (Keep)</button>
            <button class="btn-danger" id="eliminate-btn" onclick="eliminateAndNext()">Eliminate & Next</button>
        </section>

        <section aria-label="Administrative Actions">
            <button class="btn-warning" onclick="resetAll()">Reset All Questions</button>
        </section>

        <div id="error-msg" class="hidden" role="alert" aria-live="assertive"></div>
    </main>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
